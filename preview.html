                    <div className="md:col-span-3 p-6 sm:p-8 rounded-2xl bg-slate-900/40 border border-slate-800/80">
                      <h3 className="text-lg font-bold text-white mb-1">Send a Message</h3>
                      <p className="text-xs text-slate-400 mb-6">Tell me about your product requirements or role expectations.</p>

                      {formSubmitted ? (
                        <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs text-center">
                          Thank you! Your email client has been opened with your inquiry details.
                        </div>
                      ) : (
                        <form onSubmit={handleContactSubmit} className="space-y-4">
                          <div>
                            <label className="block text-xs font-medium text-slate-300 mb-1">Your Name</label>
                            <input
                              type="text"
                              required
                              value={form.name}
                              onChange={e => setForm({ ...form, name: e.target.value })}
                              placeholder="e.g. Alex Miller"
                              className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs placeholder:text-slate-600 focus:outline-none focus:border-indigo-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-300 mb-1">Your Email</label>
                            <input
                              type="email"
                              required
                              value={form.email}
                              onChange={e => setForm({ ...form, email: e.target.value })}
                              placeholder="e.g. alex@company.com"
                              className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs placeholder:text-slate-600 focus:outline-none focus:border-indigo-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-300 mb-1">Message / Requirements</label>
                            <textarea
                              required
                              rows="4"
                              value={form.message}
                              onChange={e => setForm({ ...form, message: e.target.value })}
                              placeholder="Share details regarding your tech stack, project timeline, or role expectations..."
                              className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs placeholder:text-slate-600 focus:outline-none focus:border-indigo-500 resize-none"
                            ></textarea>
                          </div>
                          <button type="submit" className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-md shadow-indigo-600/30 transition-all">
                            Send Direct Inquiry
                          </button>
                        </form>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </main>

          <footer className="py-10 bg-[#060910] border-t border-slate-900 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="font-bold text-slate-300">{PERSONAL_INFO.name}</span> · Full-Stack & Mobile Systems Engineer
              </div>
              <div className="text-slate-600 text-[11px]">
                Built with React & Tailwind CSS · Production Grade Architecture
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
